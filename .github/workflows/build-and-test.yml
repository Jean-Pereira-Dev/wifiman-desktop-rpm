name: Build and Test RPM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 02:17 UTC; avoid the busiest top-of-hour period.
    - cron: '17 2 * * *'
  workflow_dispatch:

env:
  EPEL_VERSION: '10'

permissions:
  contents: read

concurrency:
  group: wifiman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    timeout-minutes: 15
    permissions:
      contents: write
    # External PR code must not execute on the private runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]') }}
    outputs:
      fedora_versions: ${{ steps.targets.outputs.fedora_versions }}
      copr_chroots: ${{ steps.targets.outputs.copr_chroots }}
      latest_fedora: ${{ steps.targets.outputs.latest_fedora }}
      version: ${{ steps.check.outputs.latest_version }}
      download_url: ${{ steps.check.outputs.download_url }}
      sha256: ${{ steps.check.outputs.sha256 }}
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Keep daily schedule active
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          # A concurrent push already counts as activity; do not overwrite it.
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            exit 0
          fi
          LAST_COMMIT=$(git log -1 --format=%ct)
          if (( $(date +%s) - LAST_COMMIT >= 45 * 86400 )); then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --allow-empty -m 'Keep daily release checks active [skip ci]'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Test version discovery
        run: python3 -m unittest discover -s tests -v
      - name: Test release recovery
        run: node --test tests/release.test.cjs
      - name: Discover upstream release
        id: check
        run: bash scripts/check-version.sh
      - name: Discover supported stable Fedora releases
        id: targets
        run: python3 scripts/fedora_targets.py
      - name: Check published RPM assets
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ steps.check.outputs.latest_version }}
          FEDORA_VERSIONS: ${{ steps.targets.outputs.fedora_versions }}
          COPR_CONFIGURED: ${{ secrets.COPR_LOGIN != '' && secrets.COPR_TOKEN != '' }}
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'check');
      - name: Report discovery
        env:
          FEDORA_VERSIONS: ${{ steps.targets.outputs.fedora_versions }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          VERSION: ${{ steps.check.outputs.latest_version }}
          BUILD_REQUIRED: ${{ steps.release.outputs.build_required }}
        run: |
          printf '## WiFiman release check\n\nSpec baseline: %s\n\nOfficial version: %s\n\nBuild or Copr retry needed: %s\n' "$CURRENT_VERSION" "$VERSION" "$BUILD_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          printf '\nFedora test matrix: %s\n' "$FEDORA_VERSIONS" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build and test Fedora ${{ matrix.fedora }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fedora: ${{ fromJSON(needs.check-version.outputs.fedora_versions) }}
    timeout-minutes: 90
    needs: check-version
    if: needs.check-version.outputs.build_required == 'true' || github.event_name != 'schedule'
    # External PR code must not execute on the private runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]') }}
    permissions:
      contents: read
    env:
      CONTAINER_NAME: wifiman-${{ github.run_id }}-${{ github.run_attempt }}-fc${{ matrix.fedora }}
      FEDORA_VERSION: ${{ matrix.fedora }}
      VERSION: ${{ needs.check-version.outputs.version }}
      DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
      SHA256: ${{ needs.check-version.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare version and verified source
        run: |
          set -euo pipefail
          sed -i "s/^Version:.*/Version:  $VERSION/; s/^Release:.*/Release:  $GITHUB_RUN_NUMBER%{?dist}/" wifiman-desktop.spec
          sed -i "s|^Source0:.*|Source0:  $DOWNLOAD_URL|" wifiman-desktop.spec
          mkdir -p sources
          curl --fail --location --show-error --retry 3 --connect-timeout 15 --max-time 300 "$DOWNLOAD_URL" -o "sources/${DOWNLOAD_URL##*/}"
          echo "$SHA256  sources/${DOWNLOAD_URL##*/}" | sha256sum --check --strict
      - name: Build, install and uninstall on Fedora ${{ matrix.fedora }}
        run: |
          set -euo pipefail
          docker run --name "$CONTAINER_NAME" -d -w /build "fedora:$FEDORA_VERSION" tail -f /dev/null
          docker cp . "$CONTAINER_NAME:/build"
          docker exec "$CONTAINER_NAME" bash scripts/build-rpm.sh
          docker cp "$CONTAINER_NAME:/build/rpmbuild" ./rpmbuild
          mkdir release-assets
          find rpmbuild -type f -name '*.rpm' -exec cp {} release-assets/ \;
      - name: Clean up container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wifiman-${{ env.VERSION }}-fedora${{ matrix.fedora }}
          path: release-assets/*.rpm
          if-no-files-found: error

  build-epel:
    name: Build EPEL 10 and test AlmaLinux/Rocky Linux 10
    needs: check-version
    if: needs.check-version.outputs.build_required == 'true' || github.event_name != 'schedule'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
      SHA256: ${{ needs.check-version.outputs.sha256 }}
      CONTAINER_NAME: wifiman-${{ github.run_id }}-${{ github.run_attempt }}-el10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare verified source
        run: |
          set -euo pipefail
          sed -i "s/^Version:.*/Version:  $VERSION/; s/^Release:.*/Release:  $GITHUB_RUN_NUMBER%{?dist}/" wifiman-desktop.spec
          sed -i "s|^Source0:.*|Source0:  $DOWNLOAD_URL|" wifiman-desktop.spec
          mkdir -p sources
          curl --fail --location --show-error --retry 3 --connect-timeout 15 --max-time 300 "$DOWNLOAD_URL" -o "sources/${DOWNLOAD_URL##*/}"
          echo "$SHA256  sources/${DOWNLOAD_URL##*/}" | sha256sum --check --strict
      - name: Build and test on AlmaLinux 10
        run: |
          set -euo pipefail
          docker run --name "$CONTAINER_NAME" -d -w /build almalinux:10 tail -f /dev/null
          docker cp . "$CONTAINER_NAME:/build"
          docker exec "$CONTAINER_NAME" bash scripts/build-rpm.sh
          docker cp "$CONTAINER_NAME:/build/rpmbuild" ./rpmbuild
          mkdir release-assets
          find rpmbuild -type f -name '*.rpm' -exec cp {} release-assets/ \;
      - name: Test the same RPM on Rocky Linux 10
        run: |
          set -euo pipefail
          docker run --name "$CONTAINER_NAME-rocky" -d rockylinux/rockylinux:10 tail -f /dev/null
          docker cp release-assets "$CONTAINER_NAME-rocky:/tmp/release-assets"
          docker exec "$CONTAINER_NAME-rocky" bash -c 'set -e; dnf install -y dnf-plugins-core epel-release desktop-file-utils; dnf config-manager --set-enabled crb; dnf install -y /tmp/release-assets/*.x86_64.rpm; test -x /usr/lib/wifiman-desktop/wifiman-desktopd; desktop-file-validate /usr/share/applications/wifiman-desktop.desktop; dnf remove -y wifiman-desktop; ! rpm -q wifiman-desktop'
      - name: Clean up containers
        if: always()
        run: |
          docker rm -f "$CONTAINER_NAME" "$CONTAINER_NAME-rocky" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wifiman-${{ env.VERSION }}-epel10
          path: release-assets/*.rpm
          if-no-files-found: error

  publish:
    name: Publish RPMs and build in Copr
    needs: [check-version, build-and-test, build-epel]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      FEDORA_VERSIONS: ${{ needs.check-version.outputs.fedora_versions }}
      COPR_CHROOTS: ${{ needs.check-version.outputs.copr_chroots }}
      LATEST_FEDORA: ${{ needs.check-version.outputs.latest_fedora }}
      COPR_CONFIGURED: ${{ secrets.COPR_LOGIN != '' && secrets.COPR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wifiman-${{ env.VERSION }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested RPMs
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'publish');
      - name: Submit to Copr when configured
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPR_LOGIN" || -z "$COPR_TOKEN" ]]; then
            echo "Copr credentials absent; GitHub RPM release only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install copr-cli
          export XDG_CONFIG_HOME="$RUNNER_TEMP/copr-config"
          mkdir -p "$XDG_CONFIG_HOME"
          trap 'rm -f "$XDG_CONFIG_HOME/copr"' EXIT
          umask 077
          printf '[copr-cli]\nusername = jeanpereira\nlogin = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' "$COPR_LOGIN" "$COPR_TOKEN" > "$XDG_CONFIG_HOME/copr"
          "$RUNNER_TEMP/copr-venv/bin/python" scripts/sync_copr.py --config "$XDG_CONFIG_HOME/copr" --chroots "$COPR_CHROOTS"
          mapfile -t CHROOTS < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["COPR_CHROOTS"])))')
          CHROOT_ARGS=()
          for CHROOT in "${CHROOTS[@]}"; do CHROOT_ARGS+=(--chroot "$CHROOT"); done
          # One SRPM is sufficient: Copr rebuilds it independently in each chroot.
          SRPMS=(release-assets/*.fc"$LATEST_FEDORA".src.rpm)
          [[ ${#SRPMS[@]} -eq 1 && -f "${SRPMS[0]}" ]]
          "$RUNNER_TEMP/copr-venv/bin/copr-cli" --config "$XDG_CONFIG_HOME/copr" build "${CHROOT_ARGS[@]}" jeanpereira/wifiman "${SRPMS[0]}"
      - name: Record successful Copr build
        if: env.COPR_CONFIGURED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'copr-success');
