name: Build and Test RPM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 02:17 UTC; avoid the busiest top-of-hour period.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wifiman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    timeout-minutes: 15
    permissions:
      contents: write
    # External PR code must not execute on the private runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]') }}
    outputs:
      version: ${{ steps.check.outputs.latest_version }}
      download_url: ${{ steps.check.outputs.download_url }}
      sha256: ${{ steps.check.outputs.sha256 }}
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep daily schedule active
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          # A concurrent push already counts as activity; do not overwrite it.
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            exit 0
          fi
          LAST_COMMIT=$(git log -1 --format=%ct)
          if (( $(date +%s) - LAST_COMMIT >= 45 * 86400 )); then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --allow-empty -m 'Keep daily release checks active [skip ci]'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Test version discovery
        run: python3 -m unittest discover -s tests -v
      - name: Test release recovery
        run: node --test tests/release.test.cjs
      - name: Discover upstream release
        id: check
        run: bash scripts/check-version.sh
      - name: Check published RPM assets
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.check.outputs.latest_version }}
          COPR_CONFIGURED: ${{ secrets.COPR_LOGIN != '' && secrets.COPR_TOKEN != '' }}
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'check');
      - name: Report discovery
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          VERSION: ${{ steps.check.outputs.latest_version }}
          BUILD_REQUIRED: ${{ steps.release.outputs.build_required }}
        run: |
          printf '## WiFiman release check\n\nSpec baseline: %s\n\nOfficial version: %s\n\nBuild or Copr retry needed: %s\n' "$CURRENT_VERSION" "$VERSION" "$BUILD_REQUIRED" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    timeout-minutes: 90
    needs: check-version
    if: needs.check-version.outputs.build_required == 'true' || github.event_name != 'schedule'
    # External PR code must not execute on the private runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]') }}
    permissions:
      contents: write
    env:
      CONTAINER_NAME: wifiman-${{ github.run_id }}-${{ github.run_attempt }}
      COPR_CONFIGURED: ${{ secrets.COPR_LOGIN != '' && secrets.COPR_TOKEN != '' }}
      VERSION: ${{ needs.check-version.outputs.version }}
      DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
      SHA256: ${{ needs.check-version.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version and verified source
        run: |
          set -euo pipefail
          sed -i "s/^Version:.*/Version:  $VERSION/; s/^Release:.*/Release:  $GITHUB_RUN_NUMBER%{?dist}/" wifiman-desktop.spec
          sed -i "s|^Source0:.*|Source0:  $DOWNLOAD_URL|" wifiman-desktop.spec
          mkdir -p sources
          curl --fail --location --show-error --retry 3 --connect-timeout 15 --max-time 300 "$DOWNLOAD_URL" -o "sources/${DOWNLOAD_URL##*/}"
          echo "$SHA256  sources/${DOWNLOAD_URL##*/}" | sha256sum --check --strict
      - name: Build, install and uninstall on Fedora 43
        run: |
          set -euo pipefail
          docker run --name "$CONTAINER_NAME" -d -w /build fedora:43 tail -f /dev/null
          docker cp . "$CONTAINER_NAME:/build"
          docker exec "$CONTAINER_NAME" bash scripts/build-rpm.sh
          docker cp "$CONTAINER_NAME:/build/rpmbuild" ./rpmbuild
          mkdir release-assets
          find rpmbuild -type f -name '*.rpm' -exec cp {} release-assets/ \;
      - name: Clean up container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
      - uses: actions/upload-artifact@v4
        with:
          name: wifiman-${{ env.VERSION }}-fedora43
          path: release-assets/*.rpm
          if-no-files-found: error
      - name: Publish tested RPMs
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'publish');
      - name: Submit to Copr when configured
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPR_LOGIN" || -z "$COPR_TOKEN" ]]; then
            echo "Copr credentials absent; GitHub RPM release only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install copr-cli
          export XDG_CONFIG_HOME="$RUNNER_TEMP/copr-config"
          mkdir -p "$XDG_CONFIG_HOME"
          trap 'rm -f "$XDG_CONFIG_HOME/copr"' EXIT
          umask 077
          printf '[copr-cli]\nusername = jeanpereira\nlogin = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' "$COPR_LOGIN" "$COPR_TOKEN" > "$XDG_CONFIG_HOME/copr"
          "$RUNNER_TEMP/copr-venv/bin/copr-cli" --config "$XDG_CONFIG_HOME/copr" build jeanpereira/wifiman release-assets/*.src.rpm
      - name: Record successful Copr build
        if: env.COPR_CONFIGURED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/release.cjs')({github, context, core}, 'copr-success');
